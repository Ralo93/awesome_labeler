[tool.poetry]
package-mode = false
name = "semantic-unit-labeler"
version = "0.1.0"
description = "Streamlit GUI for labeling semantic units with active learning"
authors = ["Your Name"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
streamlit = "^1.28.0"
pandas = "^2.0.0"
numpy = "^1.24.0"
pyarrow = "^14.0.0"
pillow = "^10.0.0"
PyMuPDF = "^1.23.0"
scikit-learn = "^1.3.0"
joblib = "^1.3.0"
pydantic = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"